services:
  # Redis - message broker for Celery
  - type: redis
    name: dler-redis
    plan: free
    maxmemoryPolicy: noeviction

  # Celery worker - handles background downloads
  - type: worker
    name: dler-worker
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: celery -A app.celery worker --loglevel=info
    envVars:
      - key: REDIS_URL
        fromService:
          name: dler-redis
          type: redis
          property: connectionString
      - key: PYTHONUNBUFFERED
        value: "1"

  # FastAPI web server - serves the UI and API
  - type: web
    name: dler-web
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: REDIS_URL
        fromService:
          name: dler-redis
          type: redis
          property: connectionString
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /docs
